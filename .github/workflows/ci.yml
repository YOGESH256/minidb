name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The durability claims are the point of this project, and fsync
        # behaves differently per platform: macOS issues F_FULLFSYNC through
        # libuv, Linux a plain fsync. Both must pass the crash tests.
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        # The crash test spawns children and SIGKILLs them; give it room on
        # a cold CI runner without letting a genuine hang run forever.
        timeout-minutes: 10

  build:
    name: build and smoke-test the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The published entry point must work from plain compiled JavaScript,
      # with no tsx and no source present in the import path.
      - name: import dist and run a real transaction
        run: |
          node --input-type=module -e "
            import { Database } from './dist/index.js';
            import fs from 'node:fs';
            import os from 'node:os';
            import path from 'node:path';
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'minidb-smoke-'));
            const file = path.join(dir, 'smoke.db');
            const db = new Database(file);
            db.exec('CREATE TABLE t (id INT PRIMARY KEY, s TEXT NOT NULL)');
            const ins = db.prepare('INSERT INTO t VALUES (?, ?)');
            db.transaction(() => { for (let i = 0; i < 500; i++) ins.run(i, 'row ' + i); })();
            db.close();
            const again = new Database(file);
            const got = again.prepare('SELECT s FROM t WHERE id = ?').get(499);
            if (got?.s !== 'row 499') throw new Error('reopen lost data: ' + JSON.stringify(got));
            if (!again.verify().ok) throw new Error('verify failed after reopen');
            again.close();
            fs.rmSync(dir, { recursive: true, force: true });
            console.log('dist smoke test ok');
          "
