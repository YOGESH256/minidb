<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>minidb video scenes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #f3f5f8; --paper-2: #e6ebf1; --grid: rgba(23,32,43,0.07);
    --ink: #17202b; --ink-2: #4b5868; --ink-3: #7d8a9a; --line: #c2cbd6;
    --stamp: #c8322b; --stamp-soft: rgba(200,50,43,0.14);
    --safe: #2f7d5b; --safe-soft: rgba(47,125,91,0.16);
    --mem: #b7791f; --mem-soft: rgba(183,121,31,0.18);
    --panel: #ffffff;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    color: var(--ink); background: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 34px; line-height: 1.4;
  }
  #stage { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; display: none; }
  .scene.on { display: block; }
  h1, h2 { font-family: "Bricolage Grotesque", sans-serif; margin: 0; letter-spacing: -0.01em; }
  h1 { font-size: 120px; line-height: 1; font-weight: 700; }
  h2 { font-size: 72px; line-height: 1.05; font-weight: 700; }
  .eyebrow { font-size: 26px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 600; }
  .mono { font-family: "IBM Plex Mono", monospace; }
  .r { position: absolute; }
  [data-in] { opacity: 0; }
  #caption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 120px 46px;
    background: linear-gradient(transparent, rgba(243,245,248,0.92) 30%);
    font-size: 40px; line-height: 1.35; color: var(--ink); text-align: center; text-wrap: balance;
  }
  #caption span { background: var(--panel); box-shadow: 0 0 0 10px var(--panel); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  #progress { position: absolute; left: 0; bottom: 0; height: 8px; background: var(--stamp); width: 0; }
  #scenenum { position: absolute; top: 40px; right: 60px; font-family: "IBM Plex Mono", monospace; font-size: 24px; color: var(--ink-3); }

  /* generic bits */
  .box { position: absolute; background: var(--panel); border: 3px solid var(--ink); border-radius: 8px; padding: 22px 30px; }
  .box .t { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 40px; }
  .box .s { color: var(--ink-2); font-size: 28px; }
  .cell { position: absolute; height: 62px; border-radius: 6px; background: var(--paper-2); border: 2px solid var(--line); display: flex; align-items: center; padding: 0 20px; font-family: "IBM Plex Mono", monospace; font-size: 26px; color: var(--ink-2); gap: 16px; }
  .cell.dirty { background: var(--mem-soft); border-color: var(--mem); color: var(--ink); }
  .cell.safe { background: var(--safe-soft); border-color: var(--safe); color: var(--ink); }
  .cell.new { background: var(--stamp-soft); border-color: var(--stamp); color: var(--ink); }
  .cell.bad { text-decoration: line-through; opacity: 0.5; }
  .col-title { position: absolute; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 38px; }
  .col-tag { position: absolute; font-size: 22px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; padding: 4px 14px; border-radius: 999px; }
  .tag-mem { background: var(--mem-soft); color: var(--mem); }
  .tag-log { background: var(--stamp-soft); color: var(--stamp); }
  .tag-disk { background: var(--safe-soft); color: var(--safe); }
  svg { overflow: visible; }
  .layer { position: absolute; left: 560px; width: 800px; height: 86px; border: 3px solid var(--ink); background: var(--panel); border-radius: 8px; display: flex; align-items: center; gap: 24px; padding: 0 28px; font-size: 34px; font-weight: 600; }
  .layer .n { font-family: "IBM Plex Mono", monospace; color: var(--ink-3); font-size: 26px; }
  .layer .f { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 22px; color: var(--ink-3); font-weight: 400; }
  .stamp { position: absolute; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; color: var(--stamp); border: 5px solid var(--stamp); padding: 6px 22px; border-radius: 10px; font-size: 44px; transform: rotate(-8deg); letter-spacing: 0.06em; }
  .flash { position: absolute; inset: 0; background: #17202b; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="caption"><span></span></div>
<div id="progress"></div>
<div id="scenenum"></div>

<script>
// ------------------------------------------------------------------
// Deterministic timeline. window.seekTo(t) renders the frame at t seconds.
// Elements carry data-in / data-out as FRACTIONS of the scene duration and
// data-fx (fade | rise | pop). Scene-specific motion lives in `tick(p)`.
// ------------------------------------------------------------------
const stage = document.getElementById('stage');
const capEl = document.querySelector('#caption span');
const ease = (x) => 1 - Math.pow(1 - x, 3);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;

const SCENES = [];
function scene(id, html, tick) { SCENES.push({ id, html, tick: tick || (() => {}), dur: 8 }); }

// ---------- 1. title ----------
scene('title', `
  <div class="r" style="left:160px; top:300px">
    <div class="eyebrow" data-in="0" data-fx="fade">A database engine, from scratch, in TypeScript</div>
    <h1 style="margin-top:20px" data-in="0.08" data-fx="rise">minidb</h1>
    <div style="font-size:52px; margin-top:26px; max-width:1300px; color:var(--ink-2)" data-in="0.28" data-fx="rise">How it stores rows, finds them, and survives a power cut.</div>
  </div>
  <div class="r mono" style="left:160px; top:760px; font-size:30px; color:var(--ink-3)" data-in="0.5" data-fx="fade">7 layers · 4 KB pages · 2 files · 34 tests</div>
`);

// ---------- 2. the three jobs ----------
scene('jobs', `
  <div class="r" style="left:160px; top:150px"><div class="eyebrow">What a database is</div><h2 data-in="0" data-fx="rise">A very careful filing clerk</h2></div>
  <div class="box" style="left:160px; top:400px; width:480px" data-in="0.18" data-fx="pop"><div class="t">1. Store rows</div><div class="s">put things somewhere</div></div>
  <div class="box" style="left:720px; top:400px; width:480px" data-in="0.38" data-fx="pop"><div class="t">2. Find them fast</div><div class="s">without reading everything</div></div>
  <div class="box" style="left:1280px; top:400px; width:480px; border-color:var(--stamp)" data-in="0.58" data-fx="pop"><div class="t" style="color:var(--stamp)">3. Never lose anything</div><div class="s">even mid-write, even on power cut</div></div>
`);

// ---------- 3. pages ----------
scene('pages', `
  <div class="r" style="left:160px; top:120px"><div class="eyebrow">Layer 1 · src/storage/page.ts</div><h2 data-in="0" data-fx="rise">Everything lives in 4 KB pages</h2></div>
  <svg class="r" style="left:160px; top:330px" width="700" height="620" viewBox="0 0 700 620">
    <g data-in="0.05" data-fx="fade">
      <rect x="10" y="10" width="140" height="540" rx="6" fill="#fff" stroke="#17202b" stroke-width="3"/>
      <rect x="170" y="10" width="140" height="540" rx="6" fill="#fff" stroke="#17202b" stroke-width="3"/>
      <rect x="330" y="10" width="140" height="540" rx="6" fill="#fff" stroke="#17202b" stroke-width="3"/>
      <text x="80" y="300" text-anchor="middle" font-family="IBM Plex Mono" font-size="26" fill="#7d8a9a">page 0</text>
      <text x="240" y="300" text-anchor="middle" font-family="IBM Plex Mono" font-size="26" fill="#7d8a9a">page 1</text>
      <text x="400" y="300" text-anchor="middle" font-family="IBM Plex Mono" font-size="26" fill="#7d8a9a">page 2</text>
      <text x="560" y="300" text-anchor="middle" font-family="IBM Plex Mono" font-size="34" fill="#7d8a9a">…</text>
      <text x="240" y="-10" text-anchor="middle" font-family="IBM Plex Sans" font-size="26" fill="#4b5868">one file on disk, cut into 4096-byte blocks</text>
    </g>
  </svg>
  <svg class="r" style="left:1000px; top:270px" width="760" height="620" viewBox="0 0 760 620">
    <rect x="10" y="10" width="740" height="600" rx="10" fill="#fff" stroke="#17202b" stroke-width="4" data-in="0.28" data-fx="fade"/>
    <g data-in="0.34" data-fx="fade">
      <rect x="10" y="10" width="740" height="70" rx="10" fill="#e6ebf1"/>
      <text x="30" y="55" font-family="IBM Plex Mono" font-size="26" fill="#17202b">header: checksum · free-space pointers · LSN</text>
    </g>
    <g data-in="0.5" data-fx="fade">
      <rect x="30" y="100" width="210" height="46" rx="6" fill="#fff" stroke="#c8322b" stroke-width="3"/><text x="135" y="131" text-anchor="middle" font-family="IBM Plex Mono" font-size="24" fill="#c8322b">item 0 → 3980</text>
      <rect x="260" y="100" width="210" height="46" rx="6" fill="#fff" stroke="#c8322b" stroke-width="3"/><text x="365" y="131" text-anchor="middle" font-family="IBM Plex Mono" font-size="24" fill="#c8322b">item 1 → 3900</text>
      <rect x="490" y="100" width="210" height="46" rx="6" fill="#fff" stroke="#c8322b" stroke-width="3"/><text x="595" y="131" text-anchor="middle" font-family="IBM Plex Mono" font-size="24" fill="#c8322b">item 2 → 3810</text>
      <text x="30" y="185" font-family="IBM Plex Sans" font-size="24" fill="#4b5868">index grows downward ↓</text>
    </g>
    <g data-in="0.62" data-fx="fade">
      <rect x="30" y="540" width="700" height="50" rx="6" fill="#e6ebf1" stroke="#c2cbd6" stroke-width="2"/><text x="50" y="574" font-family="IBM Plex Mono" font-size="24" fill="#17202b">(1, 'ann', 31)</text>
      <rect x="30" y="480" width="700" height="50" rx="6" fill="#e6ebf1" stroke="#c2cbd6" stroke-width="2"/><text x="50" y="514" font-family="IBM Plex Mono" font-size="24" fill="#17202b">(2, 'bob', NULL)</text>
      <rect x="30" y="420" width="700" height="50" rx="6" fill="#e6ebf1" stroke="#c2cbd6" stroke-width="2"/><text x="50" y="454" font-family="IBM Plex Mono" font-size="24" fill="#17202b">(3, 'cy', 25)</text>
      <text x="730" y="395" text-anchor="end" font-family="IBM Plex Sans" font-size="24" fill="#4b5868">↑ rows grow upward</text>
    </g>
    <g data-in="0.78" data-fx="fade">
      <rect x="30" y="210" width="700" height="165" rx="6" fill="none" stroke="#2f7d5b" stroke-width="3" stroke-dasharray="10 8"/>
      <text x="380" y="303" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="34" fill="#2f7d5b">free space</text>
    </g>
  </svg>
`);

// ---------- 4. tables + b+tree ----------
scene('tree', `
  <div class="r" style="left:160px; top:120px"><div class="eyebrow">Layer 4 · heap.ts + btree.ts</div><h2 data-in="0" data-fx="rise">Tables are chains of pages. Indexes are sorted trees.</h2></div>
  <div class="r" style="left:160px; top:380px; font-size:28px; color:var(--ink-2)" data-in="0.08" data-fx="fade">table <span class="mono">users</span></div>
  <div class="cell" style="left:160px; top:440px; width:200px" data-in="0.1" data-fx="pop">page 5</div>
  <div class="cell" style="left:420px; top:440px; width:200px" data-in="0.16" data-fx="pop">page 6</div>
  <div class="cell" style="left:680px; top:440px; width:200px" data-in="0.22" data-fx="pop" id="p7">page 7</div>
  <div class="r mono" style="left:370px; top:452px; font-size:30px; color:var(--ink-3)" data-in="0.14" data-fx="fade">→</div>
  <div class="r mono" style="left:630px; top:452px; font-size:30px; color:var(--ink-3)" data-in="0.2" data-fx="fade">→</div>
  <div class="r" style="left:160px; top:540px; font-size:28px; color:var(--ink-2); max-width:720px" data-in="0.28" data-fx="fade">A row's address is <b>(page, slot)</b>. Page 7, slot 3 is the fourth row on page 7. It stays valid even when neighbours are deleted.</div>

  <div class="r" style="left:1000px; top:380px; font-size:28px; color:var(--ink-2)" data-in="0.4" data-fx="fade">index <span class="mono">users_pkey</span> (a B+tree)</div>
  <svg class="r" style="left:1000px; top:430px" width="800" height="420" viewBox="0 0 800 420">
    <g data-in="0.44" data-fx="fade">
      <rect x="290" y="10" width="220" height="70" rx="8" fill="#fff" stroke="#17202b" stroke-width="3"/>
      <text x="400" y="55" text-anchor="middle" font-family="IBM Plex Mono" font-size="26">root: ≤3 | ≥4</text>
      <line x1="350" y1="80" x2="150" y2="180" stroke="#17202b" stroke-width="3"/>
      <line x1="450" y1="80" x2="650" y2="180" stroke="#17202b" stroke-width="3"/>
      <rect x="20" y="180" width="260" height="70" rx="8" fill="#fff" stroke="#17202b" stroke-width="3"/>
      <text x="150" y="225" text-anchor="middle" font-family="IBM Plex Mono" font-size="26">leaf: 1, 2, 3</text>
      <rect x="520" y="180" width="260" height="70" rx="8" fill="#fff" stroke="#17202b" stroke-width="3"/>
      <text x="650" y="225" text-anchor="middle" font-family="IBM Plex Mono" font-size="26">leaf: 4, 5, 6</text>
      <line x1="280" y1="215" x2="520" y2="215" stroke="#7d8a9a" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="400" y="205" text-anchor="middle" font-family="IBM Plex Sans" font-size="20" fill="#7d8a9a">leaves linked for range scans</text>
    </g>
    <g id="hop1" data-in="0.62" data-fx="fade"><rect x="290" y="10" width="220" height="70" rx="8" fill="none" stroke="#c8322b" stroke-width="5"/><text x="560" y="45" font-family="IBM Plex Sans" font-size="24" fill="#c8322b">id = 4? go right</text></g>
    <g id="hop2" data-in="0.76" data-fx="fade"><rect x="520" y="180" width="260" height="70" rx="8" fill="none" stroke="#c8322b" stroke-width="5"/></g>
    <g data-in="0.86" data-fx="pop"><rect x="470" y="300" width="360" height="70" rx="8" fill="#c8322b"/><text x="650" y="346" text-anchor="middle" font-family="IBM Plex Mono" font-size="28" fill="#fff">4 → page 7, slot 3</text></g>
  </svg>
`);

// ---------- 5. page cache ----------
function storeCols(memItems, logItems, diskItems) {
  const cell = (x, y, it) => `<div class="cell ${it.cls || ''}" style="left:${x}px; top:${y}px; width:480px" ${it.attr || ''}><b>${it.id}</b><span style="opacity:.8">${it.label}</span>${it.badge ? `<span style="margin-left:auto;font-size:20px;color:${it.badgeColor}">${it.badge}</span>` : ''}</div>`;
  let h = '';
  h += `<div class="col-title" style="left:160px; top:330px">Memory</div><div class="col-tag tag-mem" style="left:330px; top:340px">volatile</div>`;
  h += `<div class="col-title" style="left:720px; top:330px">Log file</div><div class="col-tag tag-log" style="left:890px; top:340px">diary</div>`;
  h += `<div class="col-title" style="left:1280px; top:330px">Data file</div><div class="col-tag tag-disk" style="left:1470px; top:340px">the real thing</div>`;
  memItems.forEach((it, i) => (h += cell(160, 410 + i * 80, it)));
  logItems.forEach((it, i) => (h += cell(720, 410 + i * 80, it)));
  diskItems.forEach((it, i) => (h += cell(1280, 410 + i * 80, it)));
  return h;
}
scene('cache', `
  <div class="r" style="left:160px; top:120px"><div class="eyebrow">Layer 3 · src/storage/pager.ts</div><h2 data-in="0" data-fx="rise">Changes happen in memory first</h2></div>
  ${storeCols(
    [{ id: 'page 7', label: 'users rows 1–3', attr: 'data-in="0.15" data-fx="pop"' }, { id: 'page 9', label: 'index leaf', attr: 'data-in="0.22" data-fx="pop"' }],
    [{ id: '', label: 'empty', attr: 'data-in="0.05" data-fx="fade"' }],
    [{ id: 'page 0', label: 'header + catalog', cls: 'safe', attr: 'data-in="0.05" data-fx="fade"' }, { id: 'page 7', label: 'users rows 1–3', cls: 'safe', attr: 'data-in="0.05" data-fx="fade"' }, { id: 'page 9', label: 'index leaf', cls: 'safe', attr: 'data-in="0.05" data-fx="fade"' }],
  )}
  <div class="cell dirty" style="left:160px; top:410px; width:480px" data-in="0.55" data-fx="fade"><b>page 7</b><span>rows 1–3 <b>+ (4, dee, 29)</b></span><span style="margin-left:auto;font-size:20px;color:var(--mem)">changed</span></div>
  <div class="cell dirty" style="left:160px; top:490px; width:480px" data-in="0.68" data-fx="fade"><b>page 9</b><span>index leaf <b>+ 4</b></span><span style="margin-left:auto;font-size:20px;color:var(--mem)">changed</span></div>
  <div class="r mono" style="left:160px; top:720px; font-size:34px; background:#fff; padding:14px 24px; border:3px solid var(--ink); border-radius:8px" data-in="0.45" data-fx="pop">INSERT INTO users VALUES (4, 'dee', 29);</div>
  <div class="r" style="left:1280px; top:660px; font-size:28px; color:var(--ink-2); max-width:480px" data-in="0.8" data-fx="fade">Disk: untouched. If the power went out now, the row would vanish, and that is correct: you were never told it was saved.</div>
`);

// ---------- 6. WAL ----------
scene('wal', `
  <div class="r" style="left:160px; top:120px"><div class="eyebrow">Layer 2 · src/storage/wal.ts</div><h2 data-in="0" data-fx="rise">Commit writes the diary before the real file</h2></div>
  ${storeCols(
    [{ id: 'page 7', label: 'rows 1–4', cls: 'dirty', attr: 'data-in="0.02" data-fx="fade"' }, { id: 'page 9', label: 'index leaf + 4', cls: 'dirty', attr: 'data-in="0.02" data-fx="fade"' }],
    [{ id: 'image of page 7', label: '4 KB + crc', cls: 'new', attr: 'data-in="0.2" data-fx="pop"' }, { id: 'image of page 9', label: '4 KB + crc', cls: 'new', attr: 'data-in="0.32" data-fx="pop"' }, { id: 'COMMIT', label: 'marker + crc', cls: 'new', attr: 'data-in="0.46" data-fx="pop"' }],
    [{ id: 'page 0', label: 'header + catalog', cls: 'safe', attr: 'data-in="0.02" data-fx="fade"' }, { id: 'page 7', label: 'users rows 1–3', cls: 'safe', attr: 'data-in="0.02" data-fx="fade"' }, { id: 'page 9', label: 'index leaf', cls: 'safe', attr: 'data-in="0.02" data-fx="fade"' }],
  )}
  <div class="stamp" style="left:1000px; top:690px" data-in="0.6" data-fx="pop">fsync ✓</div>
  <div class="r" style="left:160px; top:720px; font-size:28px; color:var(--ink-2); max-width:520px" data-in="0.62" data-fx="fade"><span class="mono">fsync</span> = "do not return until these bytes are physically on the disk".</div>
  <div class="r mono" style="left:1280px; top:700px; font-size:44px; color:var(--safe); font-weight:600" data-in="0.82" data-fx="pop">INSERT 1</div>
  <div class="r" style="left:1280px; top:770px; font-size:26px; color:var(--ink-2); max-width:480px" data-in="0.86" data-fx="fade">You only hear this after the fsync. Data file still old. Doesn't matter.</div>
`);

// ---------- 7. power cut + recovery ----------
scene('crash', `
  <div class="flash" id="flash"></div>
  <div class="r" style="left:160px; top:120px"><div class="eyebrow">Recovery · pager.ts + wal.ts</div><h2 data-in="0.12" data-fx="rise">Pull the plug. Restart. Replay.</h2></div>
  ${storeCols(
    [{ id: '', label: 'gone (power cut)', attr: 'data-in="0.14" data-fx="fade"' }],
    [{ id: 'image of page 7', label: 'crc ok', cls: 'new', attr: 'data-in="0.14" data-fx="fade"' }, { id: 'image of page 9', label: 'crc ok', cls: 'new', attr: 'data-in="0.14" data-fx="fade"' }, { id: 'COMMIT', label: 'crc ok', cls: 'new', attr: 'data-in="0.14" data-fx="fade"' }, { id: 'image of page 12', label: 'crc BAD (torn)', cls: 'bad', attr: 'data-in="0.14" data-fx="fade"' }],
    [{ id: 'page 0', label: 'header + catalog', cls: 'safe', attr: 'data-in="0.14" data-fx="fade"' }, { id: 'page 7', label: 'users rows 1–3', cls: 'safe', attr: 'data-in="0.14" data-fx="fade"', }, { id: 'page 9', label: 'index leaf', cls: 'safe', attr: 'data-in="0.14" data-fx="fade"' }],
  )}
  <svg class="r" style="left:1210px; top:400px" width="80" height="260" viewBox="0 0 80 260">
    <g data-in="0.42" data-fx="fade" stroke="#c8322b" stroke-width="5" fill="none"><path d="M0 40 L60 40"/><path d="M45 25 L60 40 L45 55"/></g>
    <g data-in="0.52" data-fx="fade" stroke="#c8322b" stroke-width="5" fill="none"><path d="M0 120 L60 120"/><path d="M45 105 L60 120 L45 135"/></g>
  </svg>
  <div class="cell safe" style="left:1280px; top:490px; width:480px" data-in="0.46" data-fx="fade"><b>page 7</b><span>users rows <b>1–4</b></span><span style="margin-left:auto;font-size:20px;color:var(--safe)">replayed</span></div>
  <div class="cell safe" style="left:1280px; top:570px; width:480px" data-in="0.56" data-fx="fade"><b>page 9</b><span>index leaf <b>+ 4</b></span><span style="margin-left:auto;font-size:20px;color:var(--safe)">replayed</span></div>
  <div class="r" style="left:720px; top:740px; font-size:28px; color:var(--ink-2); max-width:520px" data-in="0.68" data-fx="fade">Everything up to the last COMMIT is replayed. The torn tail after it is thrown away.</div>

`, (p, el) => { const f = el.querySelector('#flash'); f.style.opacity = p < 0.06 ? 1 : p < 0.12 ? 1 - (p - 0.06) / 0.06 : 0; });

const TOWER = [

// ------------------------------------------------------------------
let CAPTIONS = SCENES.map(() => []);
window.setTimeline = (durations, captions) => {
  durations.forEach((d, i) => (SCENES[i].dur = d));
  CAPTIONS = captions;
};
window.totalDuration = () => SCENES.reduce((a, s) => a + s.dur, 0);
window.sceneCount = () => SCENES.length;

SCENES.forEach((s) => {
  const d = document.createElement('div');
  d.className = 'scene';
  d.id = 'scene-' + s.id;
  d.innerHTML = s.html;
  stage.appendChild(d);
  s.el = d;
  s.anim = [...d.querySelectorAll('[data-in]')];
});

function applyFx(el, tIn, tOut, p, dur) {
  const inAt = +el.dataset.in;
  const outAt = el.dataset.out ? +el.dataset.out : 2;
  const fx = el.dataset.fx || 'fade';
  const rise = 0.45 / dur; // ~0.45 s reveal regardless of scene length
  let k = clamp((p - inAt) / rise, 0, 1);
  if (p > outAt) k = clamp(1 - (p - outAt) / rise, 0, 1);
  const e = ease(k);
  el.style.opacity = e;
  if (fx === 'rise') el.style.transform = `translateY(${lerp(30, 0, e)}px)`;
  else if (fx === 'pop') el.style.transform = `scale(${lerp(0.9, 1, e)})`;
  else el.style.transform = '';
  el.style.transformOrigin = 'left center';
}

window.seekTo = (t) => {
  let acc = 0;
  let idx = SCENES.length - 1;
  for (let i = 0; i < SCENES.length; i++) {
    if (t < acc + SCENES[i].dur) { idx = i; break; }
    acc += SCENES[i].dur;
  }
  const s = SCENES[idx];
  const local = t - acc;
  const p = clamp(local / s.dur, 0, 1);
  SCENES.forEach((x, i) => x.el.classList.toggle('on', i === idx));
  for (const el of s.anim) applyFx(el, 0, 0, p, s.dur);
  s.tick(p, s.el);
  // caption: pick sentence by proportional share of characters
  const caps = CAPTIONS[idx] || [];
  if (caps.length) {
    const total = caps.reduce((a, c) => a + c.length, 0);
    let cum = 0, chosen = caps[caps.length - 1];
    for (const c of caps) { cum += c.length; if (p * total < cum) { chosen = c; break; } }
    capEl.textContent = chosen;
  } else capEl.textContent = '';
  document.getElementById('progress').style.width = (t / window.totalDuration()) * 100 + '%';
  document.getElementById('scenenum').textContent = `${idx + 1} / ${SCENES.length}`;
  return idx;
};
window.seekTo(0);
</script>
